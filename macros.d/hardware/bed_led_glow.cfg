# Bed LED glow effect (pixel 19 on all_pixels), implemented with a
# self-rescheduling delayed_gcode + plain SET_LED, avoiding
# SET_LED_TEMPLATE's INDEX bug (see klipper.discourse.group
# "Index in SET_LED_TEMPLATE gcode is shifted").
#
# Color tracks progress from the bed's temp AT THE MOMENT
# BED_LED_GLOW_START is called (pure blue) toward the current
# target temp (pure red).

[gcode_macro _bed_led_glow_vars]
variable_active: False
variable_start_temp: 0.0
gcode:

[delayed_gcode BED_LED_GLOW_LOOP]
initial_duration: 0
gcode:
    {% if printer["gcode_macro _bed_led_glow_vars"].active %}
        {% set start_temp = printer["gcode_macro _bed_led_glow_vars"].start_temp %}
        {% set target = printer.heater_bed.target %}
        {% if target > start_temp %}
            {% set raw_ratio = (printer.heater_bed.temperature - start_temp) / (target - start_temp) %}
            {% set ratio = [[raw_ratio, 0.0]|max, 1.0]|min %}
        {% else %}
            {% set ratio = 0.0 %}
        {% endif %}
        SET_LED LED=all_pixels INDEX=19 RED={ratio} GREEN=0 BLUE={1 - ratio} TRANSMIT=1
        UPDATE_DELAYED_GCODE ID=BED_LED_GLOW_LOOP DURATION=1
    {% endif %}

[gcode_macro BED_LED_GLOW_START]
gcode:
    SET_GCODE_VARIABLE MACRO=_bed_led_glow_vars VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_bed_led_glow_vars VARIABLE=start_temp VALUE={printer.heater_bed.temperature}
    UPDATE_DELAYED_GCODE ID=BED_LED_GLOW_LOOP DURATION=0.1

[gcode_macro BED_LED_GLOW_STOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_bed_led_glow_vars VARIABLE=active VALUE=False
    SET_LED LED=all_pixels INDEX=19 RED=0 GREEN=0 BLUE=0 TRANSMIT=1
