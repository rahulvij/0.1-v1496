#####################################################################
#   print_start macro
#####################################################################
[gcode_macro _CG28]
description: Helper: Conditional homing
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %} 
        G28 
    {% endif %}

[gcode_macro PRINT_START]
gcode:
    {action_respond_info("Running PRINT START...")}    
    # This part fetches data from your slicer. Such as bed temp, extruder temp, chamber temp and size of your printer.
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set target_chamber = params.CHAMBER|default("50")|int %}
    {% set chamber_sensor = printer["temperature_sensor chamber"] %}

    # Homes the printer and sets absolute positioning
    STATUS_HOMING
    G28                   # Full home (XYZ)
    G90                   # Absolut position

    BED_LED_GLOW_START
    STATUS_HEATING
    # If the chamber is less than target then soak for 40 mins else 0 mins
    {% if chamber_sensor.temperature|int < target_chamber %}
        # PREP_CHAMBER BED={target_bed} CHAMBER={target_chamber} SOAK=60
        PREP_CHAMBER_SLOW SOAK=5
        STATUS_HOMING
        G28                   # Full home (XYZ)
    {% else %}
        PREP_CHAMBER BED={target_bed} CHAMBER={target_chamber} SOAK=0
    {% endif %}
    
    # Heats up the nozzle up to target via slicer
    M107                        # Turns off partcooling fan
    M190 S{target_bed}          # Heats the bed to printing temp
    M109 S{target_extruder}     # Heats the nozzle to printing temp
    
    #CLEAN_NOZZLE
    
    SETUP_LINE_PURGE DISPLAY_PARAMETERS=1 ADAPTIVE_ENABLE=1 FLOW_RATE=24 #PURGE_AMOUNT=15 LINE_LENGTH=46 
    LINE_PURGE                 # Adaptive Purge
    G1 E0.5 F3600               # Add filament pressure
    # PURGE_LINE                   # NOT Adaptive Purge
    STATUS_PRINTING
    M117 "Printing..."

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament
    G91                            ; relative positioning

    M117 "Print end, moving to a safe spot..."
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    # {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set max_z = 116 %}

    #   Check end position to determine safe direction to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z > (max_z - 30.0) %}
        {% set z_safe = 116.0 %}
    {% else %}
        {% set z_safe = printer.toolhead.position.z + 20 %}
    {% endif %}

    # G0 Z{z_safe} F3600                      ; move nozzle up
    # G0 X{x_safe} Y{y_safe} F20000           ; move nozzle to remove stringing      
    TURN_OFF_HEATERS
    M107                                    ; turn off fan
    G90                                     ; absolute positioning
    G0 Z{max_z} F3600                      ; move nozzle up
    G0 X{max_x-5} Y{max_y-5} F3600          ; park nozzle at rear
    
    BED_LED_GLOW_STOP
    STATUS_READY
    M117 "Finished Printing..."
     
[gcode_macro PURGE_LINE]
gcode:
    {action_respond_info("Running PURGE LINE...")}

    G90                    ; absolute positioning

    G1 X30 Y0 Z0.4 F8000   ; move to purge start
 
    G91                    ; relative positioning
    G1 E10 F200             ; purge blob
    G1 X50 E15 F1200       ; first line
    G1 X30 Z4.6 F10000     ; Move away quickly
    G92 E0                 ; zero the extruder
    G90                    ; absolute positioning

######################### PREP FOR PRINT #########################

[gcode_macro PREP_CHAMBER]
gcode:
    {% set target_bed = params.BED|default(110)|int %}
    {% set target_chamber = params.CHAMBER|default(50)|int %}
    {% set soak_delay = params.SOAK|default(10)|float %} 
    {action_respond_info("Running PREP CHAMBER...")}    

    # Homes the printer and sets absolute positioning
    _CG28                   # Full home (XYZ)
    G90                   # Absolut position
    
    # Checks if the bed temp is higher than 90c - if so then trigger a heatsoak
    {% if target_bed >= 100 %} 
        {action_respond_info("Soaking for %d mins" % (soak_delay))}    
        PARKCENTER                  # Goes to center of the bed
        M190 S{target_bed}                                # Sets target temp for the bed
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber}   # Waits for chamber to reach desired temp
        _SOAK SOAK={soak_delay}

  # If the bed temp is not over 100c then it skips the heatsoak and just heats up to set temp with a 5min soak.
    {% else %} 
        {action_respond_info("No Soaking")}    
        PARKCENTER                  # Goes to center of the bed
        M190 S{target_bed}                              # Sets target temp for the bed
        # G4 P300000                                      # Waits 5 min for the bedtemp to stabilize
    {% endif %} 

[gcode_macro PREP_CHAMBER_SLOW]
gcode:
    {% set soak_delay = params.SOAK|default(10)|float %}
    {% set bed_temp = printer.extruder.temperature %}  # Get current bed temperature
    {% set chamber_temp = printer["temperature_sensor chamber"].temperature %}  # Get current chamber temperature

    {action_respond_info("Running SLOW PREP CHAMBER...")}    
    {action_respond_info("Current Bed Temp: %.1fC, Current Chamber Temp: %.1fC" % (bed_temp, chamber_temp))}
    # {action_respond_info("Current Bed Temp: %d" ~ bed_temp ~ "°C, Current Chamber Temp: " ~ chamber_temp ~ "°C")}

    _CG28                   # Full home (XYZ)
    G90                     # Absolute positioning    
    PARKCENTER              # Goes to center of the bed
    
    {% if bed_temp <= 99 %}
        {action_respond_info("Setting bed temperature to 99")}
        M190 S99  # Sets target temp for the bed
    {% else %}
        {action_respond_info("Bed temperature is already above 99, skipping M190 S99")}
    {% endif %}
    
    SET_FAN_SPEED FAN=bed_fan SPEED=0.05

    {% if chamber_temp < 35 %}
        {action_respond_info("Waiting for chamber to reach 35")} 
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=35   
    {% endif %}

    {% if chamber_temp < 37.5 %}
        SET_FAN_SPEED FAN=bed_fan SPEED=0.075
        {action_respond_info("Waiting for chamber to reach 37.5")} 
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=37.5   
    {% endif %}

    {% if chamber_temp < 40 %}
        SET_FAN_SPEED FAN=bed_fan SPEED=0.1
        SET_FAN_SPEED FAN=nevermore SPEED=0.05
        {action_respond_info("Waiting for chamber to reach 40")} 
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=40   
    {% endif %}

    {% if chamber_temp < 42.5 %}
        SET_FAN_SPEED FAN=bed_fan SPEED=0.12
        SET_FAN_SPEED FAN=nevermore SPEED=0.15
        {action_respond_info("Waiting for chamber to reach 42.5")} 
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=42.5   
    {% endif %}

    {% if chamber_temp < 45 %}
        SET_FAN_SPEED FAN=bed_fan SPEED=0.14
        SET_FAN_SPEED FAN=nevermore SPEED=0.25
        {action_respond_info("Waiting for chamber to reach 45")} 
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=45   
    {% endif %}

    SET_FAN_SPEED FAN=bed_fan SPEED=0.16
    SET_FAN_SPEED FAN=nevermore SPEED=0.35

    M190 S110  # Sets target temp for the bed
    
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM=55   
    _SOAK SOAK={soak_delay}

